<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f3">
  <title>Q3 Agent Lab | Zenme</title>
  <style>
    :root{color-scheme:light;--bg:#f5f5f3;--panel:#fff;--soft:#f9f9f7;--ink:#181918;--muted:#696e6b;--line:#dedfdb;--accent:#f44250;--danger:#b42332;--success:#237653;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100dvh;color:var(--ink);background:var(--bg)}button{font:inherit;color:inherit}button:focus-visible{outline:3px solid #f4425030;outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .topbar{position:sticky;z-index:10;top:0;display:flex;align-items:center;gap:13px;height:64px;padding:0 24px;border-bottom:1px solid var(--line);background:#fffffff5;backdrop-filter:blur(14px)}
    .brand-mark{width:42px;height:27px;background:center/contain no-repeat url("data:image/svg+xml,%3Csvg width='602' height='360' viewBox='0 0 602 360' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M481.36 180C481.36 196.572 474.639 211.572 463.757 222.42C452.875 233.28 437.845 240 421.24 240C404.635 240 389.605 246.708 378.735 257.568C367.853 268.428 361.12 283.428 361.12 300C361.12 316.572 354.399 331.572 343.517 342.42C332.635 353.28 317.605 360 301 360C284.395 360 269.365 353.28 258.495 342.42C247.613 331.572 240.88 316.572 240.88 300C240.88 283.428 247.613 268.428 258.495 257.568C269.365 246.708 284.395 240 301 240C317.605 240 332.635 233.28 343.517 222.42C354.399 211.572 361.12 196.572 361.12 180C361.12 146.856 334.21 120 301 120C284.395 120 269.365 113.28 258.495 102.42C247.613 91.572 240.88 76.572 240.88 60C240.88 43.428 247.613 28.428 258.495 17.568C269.365 6.708 284.395 0 301 0C334.21 0 361.12 26.856 361.12 60C361.12 76.572 367.853 91.572 378.735 102.42C389.605 113.28 404.635 120 421.24 120C454.45 120 481.36 146.856 481.36 180Z' fill='%23F44250'/%3E%3Cpath d='M240.88 180C240.88 146.862 213.964 120 180.76 120C147.557 120 120.64 146.862 120.64 180C120.64 213.137 147.557 240 180.76 240C213.964 240 240.88 213.137 240.88 180Z' fill='%23171818'/%3E%3Cpath d='M120.64 300C120.64 266.863 93.7234 240 60.52 240C27.3167 240 0.400024 266.863 0.400024 300C0.400024 333.138 27.3167 360 60.52 360C93.7234 360 120.64 333.138 120.64 300Z' fill='%23171818'/%3E%3Cpath d='M601.6 300C601.6 266.863 574.683 240 541.48 240C508.277 240 481.36 266.863 481.36 300C481.36 333.138 508.277 360 541.48 360C574.683 360 601.6 333.138 601.6 300Z' fill='%23171818'/%3E%3C/svg%3E")}.brand{font-size:17px;font-weight:760;letter-spacing:-.025em}.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
    .new-test{min-height:40px;padding:0 16px;border:1px solid #c82f3c;border-radius:8px;color:#fff;background:var(--accent);font-weight:750;cursor:pointer}.new-test:hover:not(:disabled){background:#d83240}.new-test:disabled{cursor:wait;opacity:.6}
    .run-status{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel);font-size:12px;font-weight:750}.run-status:before{content:"";width:7px;height:7px;margin-right:7px;border-radius:50%;background:#8c918e}.run-status[data-state="live"]{color:var(--success);border-color:#94c4ae}.run-status[data-state="live"]:before{background:#2b9568;animation:pulse 1.2s ease-in-out infinite}.run-status[data-state="complete"]:before{background:var(--accent)}
    .app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100dvh - 64px)}.runs{padding:20px 12px;border-right:1px solid var(--line);background:#efefec}.runs h2{margin:0 8px 12px;font-size:12px;letter-spacing:.05em;text-transform:uppercase}.run-list{display:flex;flex-direction:column;gap:4px}.run-item{width:100%;padding:10px 11px;border:1px solid transparent;border-radius:7px;background:transparent;text-align:left;cursor:pointer}.run-item:hover{background:#fff8}.run-item.is-selected{border-color:var(--line);background:#fff}.run-item strong,.run-item span{display:block}.run-item strong{font-size:12px}.run-item span{margin-top:4px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .main{min-width:0;padding:24px clamp(16px,2.5vw,36px) 36px}.run-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.run-head h1{margin:3px 0 0;font-size:24px;letter-spacing:-.035em}.run-head p{margin:6px 0 0;color:var(--muted);font-size:12px}.eyebrow{color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
    .metrics{display:grid;grid-template-columns:repeat(5,1fr);margin:0 0 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.metric{padding:12px 14px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric dt{color:var(--muted);font-size:10px;font-weight:650}.metric dd{margin:5px 0 0;font:750 19px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.metric small{margin-left:4px;color:var(--muted);font:500 9px/1 system-ui,sans-serif}
    .agents{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}.agent-card{--agent:#8b918d;--shirt:#65716b;--hair:#252725;--skin:#e3b18b;display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:8px;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:left;cursor:pointer;opacity:.52}.agent-card.is-online{opacity:1}.agent-card.is-selected{border-color:var(--agent);box-shadow:inset 0 0 0 1px var(--agent)}.agent-card.is-active .sprite{animation:bob 700ms steps(2,end) infinite alternate}.slot-mike{--agent:#3975c6;--shirt:#3d6fa6;--hair:#1a1b20}.slot-bella{--agent:#d4583f;--shirt:#c95945;--hair:#a95334}.slot-ian{--agent:#39805a;--shirt:#487f5c;--hair:#71533c;--skin:#d5a37e}.slot-eric{--agent:#7655a7;--shirt:#7655a7;--hair:#191921}.agent-info{min-width:0}.agent-title{display:flex;gap:6px;align-items:baseline}.agent-title strong{font-size:13px}.agent-title span{color:var(--muted);font-size:10px}.agent-state{display:block;margin-top:4px;color:var(--agent);font:700 9px/1.2 ui-monospace,monospace;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-budget{display:block;margin-top:5px;color:var(--muted);font:500 9px/1 ui-monospace,monospace}
    .sprite{position:relative;width:42px;height:52px;image-rendering:pixelated;transform:scale(.72);transform-origin:center}.sprite-shadow{position:absolute;left:5px;bottom:0;width:34px;height:7px;border-radius:50%;background:#0002}.sprite-head{position:absolute;top:8px;left:10px;width:27px;height:25px;border:4px solid #2c241e;background:var(--skin);box-shadow:inset 0 -4px #c88c6d}.sprite-hair{position:absolute;top:3px;left:7px;width:33px;height:13px;border:4px solid #2c241e;border-bottom:0;background:var(--hair)}.sprite-eye{position:absolute;z-index:2;top:21px;width:3px;height:3px;background:#282019}.sprite-eye.left{left:17px}.sprite-eye.right{left:30px}.sprite-body{position:absolute;top:32px;left:5px;width:36px;height:20px;border:4px solid #2c241e;background:var(--shirt)}.sprite-leg{position:absolute;bottom:1px;width:12px;height:13px;border:4px solid #2c241e;background:#33443f}.sprite-leg.left{left:8px}.sprite-leg.right{right:8px}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:560px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}.workbench{min-width:0;border-right:1px solid var(--line)}.tabs{display:flex;gap:3px;padding:8px 12px 0;overflow-x:auto;border-bottom:1px solid var(--line)}.tab{min-height:40px;padding:0 11px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
    .feed-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 11px}.feed-head h2{margin:0;font-size:16px}.filter-note{color:var(--muted);font-size:10px}.event-feed{display:flex;flex-direction:column;gap:7px;max-height:510px;margin:0;padding:0 12px 16px;overflow:auto;list-style:none}.empty{padding:52px 20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}
    .feed-button{width:100%;padding:10px 11px;border:1px solid var(--line);border-left:3px solid #999f9b;border-radius:7px;background:var(--soft);text-align:left;cursor:pointer}.feed-button:hover,.feed-button.is-selected{background:#f1f2ef}.feed-button.is-selected{box-shadow:inset 3px 0 0 var(--accent)}.kind-question .feed-button,.kind-edit .feed-button,.kind-share .feed-button{border-left-color:var(--accent)}.kind-finding .feed-button,.kind-error .feed-button{border-left-color:var(--danger);background:#fff7f7}.kind-note .feed-button{border-left-style:dashed}.feed-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}.feed-meta strong{color:var(--ink);font-size:12px}.tag{padding:3px 6px;border-radius:4px;background:#e9eae8;font-weight:700;text-transform:uppercase}.tag.alert{color:var(--danger);background:#f8dfe2}.feed-meta time{margin-left:auto;font-family:ui-monospace,monospace}.feed-text{margin:7px 0 0;overflow-wrap:anywhere;color:#373a38;font-size:12px;line-height:1.48}
    .result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.result-card{padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}.result-card span{display:block;color:var(--muted);font-size:10px}.result-card strong{display:block;margin-top:6px;font:750 20px/1 ui-monospace,monospace}.result-heading{margin:14px 2px 2px;font-size:12px}.score-row{padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}.score-top{display:flex;align-items:center;gap:7px;font-size:12px}.score-top strong:last-child{margin-left:auto;font:750 14px/1 ui-monospace,monospace}.score-row p{margin:7px 0 0;color:#4f5451;font-size:11px;line-height:1.45}.model-gap{padding:12px;border:1px solid #efb8bd;border-radius:7px;color:#7e2029;background:#fff3f4;font-size:12px;line-height:1.5}
    .inspector{padding:18px;background:#fafaf8}.inspector h2{margin:0;font-size:18px}.inspector-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}.inspector-meta span{padding:4px 7px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:#fff;font-size:10px;font-weight:700}.inspector-text{margin:17px 0;overflow-wrap:anywhere;font-size:13px;line-height:1.65}
    @keyframes bob{to{transform:scale(.72) translateY(-5px)}}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 0 5px #2b956822}}
    @media(max-width:900px){.app{grid-template-columns:1fr}.runs{padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.runs h2{display:none}.run-list{flex-direction:row;overflow-x:auto}.run-item{min-width:170px}.workspace{grid-template-columns:1fr}.workbench{border-right:0;border-bottom:1px solid var(--line)}.inspector{min-height:220px}}
    @media(max-width:650px){.topbar{padding:0 14px}.run-status{display:none}.main{padding:16px 14px 28px}.metrics,.result-grid{grid-template-columns:repeat(2,1fr)}.metric{border-bottom:1px solid var(--line)}.metric:nth-child(2n){border-right:0}.metric:last-child{grid-column:1/-1;border-bottom:0}.agents{grid-template-columns:repeat(2,minmax(0,1fr))}.feed-head{align-items:flex-start;flex-direction:column;gap:5px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" role="img" aria-label="Zenme"></div>
    <div class="brand">Q3 Agent Lab</div>
    <div class="top-actions">
      <button id="run-start" class="new-test" type="button">New test</button>
      <span id="run-status" class="run-status" role="status">Loading</span>
    </div>
  </header>
  <div class="app">
    <aside class="runs" aria-labelledby="runs-title">
      <h2 id="runs-title">Runs</h2>
      <nav id="run-list" class="run-list" aria-label="Test runs"></nav>
    </aside>
    <main class="main">
      <header class="run-head">
        <div><h1 id="run-title">No runs yet</h1><p id="run-participants"></p></div>
      </header>
      <dl class="metrics" aria-label="Run metrics">
        <div class="metric"><dt>Agents</dt><dd data-count="participants">0</dd></div>
        <div class="metric"><dt>Question writes</dt><dd><span data-count="questions">0</span><small>/ 10 each</small></dd></div>
        <div class="metric"><dt>Answers</dt><dd><span data-count="answers">0</span><small>/ 100 each</small></dd></div>
        <div class="metric"><dt>Shares</dt><dd data-count="shares">0</dd></div>
        <div class="metric"><dt>Findings</dt><dd data-count="findings">0</dd></div>
      </dl>
      <section class="agents" aria-label="Agents">
        <button class="agent-card slot-mike" type="button" data-agent="Mike" aria-pressed="false"><span class="sprite" aria-hidden="true"><span class="sprite-shadow"></span><span class="sprite-leg left"></span><span class="sprite-leg right"></span><span class="sprite-body"></span><span class="sprite-head"></span><span class="sprite-hair"></span><span class="sprite-eye left"></span><span class="sprite-eye right"></span></span><span class="agent-info"><span class="agent-title"><strong>Mike</strong><span>Korea</span></span><span class="agent-state">Offline</span><span class="agent-budget">Q 0  A 0</span></span></button>
        <button class="agent-card slot-bella" type="button" data-agent="Bella" aria-pressed="false"><span class="sprite" aria-hidden="true"><span class="sprite-shadow"></span><span class="sprite-leg left"></span><span class="sprite-leg right"></span><span class="sprite-body"></span><span class="sprite-head"></span><span class="sprite-hair"></span><span class="sprite-eye left"></span><span class="sprite-eye right"></span></span><span class="agent-info"><span class="agent-title"><strong>Bella</strong><span>Australia</span></span><span class="agent-state">Offline</span><span class="agent-budget">Q 0  A 0</span></span></button>
        <button class="agent-card slot-ian" type="button" data-agent="Ian" aria-pressed="false"><span class="sprite" aria-hidden="true"><span class="sprite-shadow"></span><span class="sprite-leg left"></span><span class="sprite-leg right"></span><span class="sprite-body"></span><span class="sprite-head"></span><span class="sprite-hair"></span><span class="sprite-eye left"></span><span class="sprite-eye right"></span></span><span class="agent-info"><span class="agent-title"><strong>Ian</strong><span>South Africa</span></span><span class="agent-state">Offline</span><span class="agent-budget">Q 0  A 0</span></span></button>
        <button class="agent-card slot-eric" type="button" data-agent="Eric" aria-pressed="false"><span class="sprite" aria-hidden="true"><span class="sprite-shadow"></span><span class="sprite-leg left"></span><span class="sprite-leg right"></span><span class="sprite-body"></span><span class="sprite-head"></span><span class="sprite-hair"></span><span class="sprite-eye left"></span><span class="sprite-eye right"></span></span><span class="agent-info"><span class="agent-title"><strong>Eric</strong><span>Taiwan</span></span><span class="agent-state">Offline</span><span class="agent-budget">Q 0  A 0</span></span></button>
      </section>
      <section class="workspace" aria-label="Run activity">
        <div class="workbench">
          <div id="view-tabs" class="tabs" role="tablist" aria-label="Run views">
            <button class="tab" role="tab" type="button" data-view="results" aria-selected="true">Results</button>
            <button class="tab" role="tab" type="button" data-view="overview" aria-selected="false">Overview</button>
            <button class="tab" role="tab" type="button" data-view="conversation" aria-selected="false">Conversation</button>
            <button class="tab" role="tab" type="button" data-view="findings" aria-selected="false">Findings</button>
            <button class="tab" role="tab" type="button" data-view="memories" aria-selected="false">Memories</button>
            <button class="tab" role="tab" type="button" data-view="diagnostics" aria-selected="false">Diagnostics</button>
          </div>
          <header class="feed-head"><h2 id="view-title">Recent activity</h2><span id="filter-note" class="filter-note">All agents</span></header>
          <ol id="event-feed" class="event-feed" aria-labelledby="view-title"></ol>
        </div>
        <aside class="inspector" aria-labelledby="event-title">
          <h2 id="event-title">No event selected</h2>
          <div class="inspector-meta"><span id="event-actor">Q3</span><span id="event-time">--:--:--</span><span id="event-kind">System</span></div>
          <p id="event-text" class="inspector-text">Select an event.</p>
        </aside>
      </section>
    </main>
  </div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/viewer.mjs"></script>
</body>
</html>
